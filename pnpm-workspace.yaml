# Security overrides. Each entry is the minimum PATCHED version named by a
# `pnpm audit` advisory, pinned inside the major range already resolved — never
# a major bump, so no transitive API breaks. Each is a deep dependency that no
# direct-dependency bump reaches. All three are build/tooling-time only:
# `pnpm audit --prod` is clean without them.
# Re-check with `pnpm audit`; drop an entry once the upstream package ships a
# range that satisfies it on its own.
overrides:
  # Quadratic CPU consumption in !!omap and empty merge sources (high). Build-time.
  js-yaml: ">=4.3.2 <5"
  # Unbounded memory growth + prototype write on untrusted config (high). Build-time.
  browserslist: ">=4.28.7 <5"
  # Event-loop DoS via indexed source maps (high). next -> postcss. Build-time.
  source-map-js: ">=1.2.2 <2"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
